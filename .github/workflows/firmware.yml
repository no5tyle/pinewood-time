name: Firmware

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Timer core tests (host, with sanitizers)
        run: make -C firmware/test

      - name: Pico SDK 2.1.1
        run: |
          git clone --depth 1 --branch 2.1.1 https://github.com/raspberrypi/pico-sdk "$RUNNER_TEMP/pico-sdk"
          git -C "$RUNNER_TEMP/pico-sdk" submodule update --init --depth 1 lib/tinyusb
          echo "PICO_SDK_PATH=$RUNNER_TEMP/pico-sdk" >> "$GITHUB_ENV"

      - name: Build for Pico and Pico 2
        run: |
          cmake -S firmware -B firmware/build -G Ninja -DPICO_BOARD=pico
          cmake --build firmware/build
          cmake -S firmware -B firmware/build-pico2 -G Ninja -DPICO_BOARD=pico2
          cmake --build firmware/build-pico2
          mkdir -p out
          cp firmware/build/pinewood_time.uf2 out/pinewood-time-pico.uf2
          cp firmware/build-pico2/pinewood_time.uf2 out/pinewood-time-pico2.uf2

      - uses: actions/upload-artifact@v4
        with:
          name: pinewood-time-firmware
          path: out/*.uf2
